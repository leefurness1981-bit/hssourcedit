<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Unsubscribed — HS Sourced It</title>
  <link rel="icon" href="images/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #f5f5f5; font-family: Archivo, Arial, sans-serif; }
    main { min-height: 100%; display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box; }
    img { width: 180px; max-width: 60vw; margin-bottom: 28px; }
    h1 { font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: clamp(2rem, 8vw, 3.2rem); line-height: 1; margin: 0 0 14px; text-transform: uppercase; }
    p { color: #a3a3a3; margin: 0 0 28px; max-width: 26rem; }
    a.btn { display: inline-block; border: 1px solid #fff; color: #fff; text-decoration: none; padding: 14px 28px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: .85rem; }
    a.btn:hover { background: #fff; color: #000; }
  </style>
</head>
<body>
  <main>
    <div>
      <img src="images/logo-transparent.png" alt="HS Sourced It">
      <h1 id="t">You've been unsubscribed</h1>
      <p id="m">You won't get any more marketing emails from us. Order and delivery emails will still come through if you buy something.</p>
      <a class="btn" href="./">Back to the shop</a>
    </div>
  </main>
  <script>
    if (new URLSearchParams(location.search).get("s") === "bad") {
      document.getElementById("t").textContent = "That link didn't work";
      document.getElementById("m").textContent = "The unsubscribe link looks incomplete. Try clicking it again from the email, or message us and we'll take you off the list.";
    }
  </script>
</body>
</html>
