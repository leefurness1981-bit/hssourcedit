# One-off: clear test campaigns and customer messages before go-live. Run once, then removed.
name: One-off clear test data
on: workflow_dispatch
permissions:
  contents: read
jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Delete sent campaigns and message history
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 --single-transaction <<'SQL'
          select 'before: campaigns ' || (select count(*) from public.campaigns) || ', messages ' || (select count(*) from public.customer_messages) || ', products ' || (select count(*) from public.products);
          delete from public.campaigns;
          delete from public.customer_messages;
          delete from public.audit_log;
          select 'after:  campaigns ' || (select count(*) from public.campaigns) || ', messages ' || (select count(*) from public.customer_messages) || ', activity ' || (select count(*) from public.audit_log) || ', products ' || (select count(*) from public.products);
          SQL
