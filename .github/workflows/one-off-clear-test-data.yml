# One-off: clear test data before go-live (orders, offers, activity log). Stock and products are kept.
# Run by hand once, then this file is removed.
name: One-off clear test data
on: workflow_dispatch
permissions:
  contents: read
jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Delete test orders, offers and activity
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 --single-transaction <<'SQL'
          select 'before: orders ' || (select count(*) from public.orders) || ', offers ' || (select count(*) from public.offers) || ', activity ' || (select count(*) from public.audit_log) || ', products ' || (select count(*) from public.products);
          delete from public.offers;
          delete from public.orders;
          delete from public.audit_log;
          select 'after:  orders ' || (select count(*) from public.orders) || ', offers ' || (select count(*) from public.offers) || ', activity ' || (select count(*) from public.audit_log) || ', products ' || (select count(*) from public.products);
          SQL
