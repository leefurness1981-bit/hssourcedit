name: One-off diagnostic
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DB_URL" -At <<'SQL'
          select 'DIAG customers total: ' || count(*) || ', opted in: ' || count(*) filter (where marketing_opt_in) || ', created today: ' || count(*) filter (where created_at > now() - interval '1 day') from public.customers;
          select 'DIAG riley exists: ' || exists(select 1 from public.customers where email like 'rileysmith65%') || ', hsl8r exists: ' || exists(select 1 from public.customers where email like 'hsl8r%');
          select 'DIAG customer deletes today: ' || count(*) from public.audit_log where table_name='customers' and action='delete' and at > now() - interval '1 day';
          select 'DIAG ' || to_char(at,'HH24:MI') || ' ' || action || ' ' || actor from public.audit_log where table_name='customers' and action='delete' and at > now() - interval '1 day' order by at;
          SQL
