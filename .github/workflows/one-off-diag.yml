name: One-off diagnostic
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DB_URL" -At <<'SQL'
          select to_char(at,'HH24:MI:SS.MS') || ' | ' || table_name || ' | ' || action || ' | ' || actor || ' | fields: ' ||
                 coalesce((select string_agg(k, ', ') from jsonb_object_keys(changes) k), '')
          from public.audit_log where at > now() - interval '1 day' and table_name = 'customers' order by at;
          SQL
