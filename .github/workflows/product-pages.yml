# Keeps the shareable product link pages (p/<id>/) in step with the products in admin.
# Runs every 15 minutes, and can be run by hand from the Actions tab ("Run workflow").
# New products get a working link straight away (the shop opens it either way);
# this just adds the photo/title preview when the link is shared.
name: Product link pages

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/product-pages.mjs"
      - ".github/workflows/product-pages.yml"

permissions:
  contents: write

concurrency:
  group: product-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build product pages
        run: node .github/scripts/product-pages.mjs
      - name: Save changes
        run: |
          git add -A p
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update product link pages"
          git pull --rebase origin main
          git push
