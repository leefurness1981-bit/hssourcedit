<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found — HS Sourced It</title>
  <link rel="icon" href="/images/favicon.png">
  <script>
    // A product link whose preview page hasn't been built yet (/p/<id>/) still opens the product
    var m = location.pathname.match(/^\/p\/([^\/]+)\/?$/);
    if (m) location.replace("/?p=" + m[1]);
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #000; color: #f5f5f5; font-family: Arial, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    a { display: inline-block; margin-top: 18px; border: 1px solid #fff; color: #fff; padding: 12px 24px; text-decoration: none; font-weight: bold; letter-spacing: .1em; text-transform: uppercase; font-size: .85rem; }
  </style>
</head>
<body>
  <div><h1>Page not found</h1><p style="color:#999">That page doesn't exist.</p><a href="/">Back to the shop</a></div>
</body>
</html>
